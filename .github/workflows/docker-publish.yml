name: Build and publish container image

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to GHCR and Docker Hub
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build, test, and publish
    runs-on: ubuntu-24.04
    env:
      TEST_IMAGE: deepseek-harness:ci
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve build settings
        id: settings
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          set -euo pipefail

          dsh_version=$(node --print "require('./package.json').dependencies['@deepseek-ai/dsh']")
          ghcr_image=$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY_OWNER}/deepseek-harness" | tr '[:upper:]' '[:lower:]')
          dockerhub_enabled=false
          dockerhub_image=""

          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            dockerhub_repository=${DOCKERHUB_REPOSITORY:-deepseek-harness}
            dockerhub_image=$(printf '%s/%s' "$DOCKERHUB_USERNAME" "$dockerhub_repository" | tr '[:upper:]' '[:lower:]')
            dockerhub_enabled=true
          elif [[ -n "$DOCKERHUB_USERNAME" || -n "$DOCKERHUB_TOKEN" ]]; then
            echo "::warning::Docker Hub publish is disabled because both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required."
          else
            echo "::notice::Docker Hub credentials are not configured; this run will publish only to GHCR."
          fi

          {
            echo "dsh_version=$dsh_version"
            echo "ghcr_image=$ghcr_image"
            echo "dockerhub_enabled=$dockerhub_enabled"
            echo "images<<EOF"
            echo "$ghcr_image"
            if [[ -n "$dockerhub_image" ]]; then echo "$dockerhub_image"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: publish
        shell: bash
        env:
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          enabled=false
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            enabled=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" == "true" ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.settings.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dsh-${{ steps.settings.outputs.dsh_version }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=DeepSeek Harness
            org.opencontainers.image.description=Unofficial container image for DeepSeek Harness
            org.opencontainers.image.licenses=MIT
            io.deepseek-harness.upstream.version=${{ steps.settings.outputs.dsh_version }}

      - name: Build local smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            DSH_VERSION=${{ steps.settings.outputs.dsh_version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=max,scope=deepseek-harness

      - name: Smoke test image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$TEST_IMAGE" --version

          container=deepseek-harness-smoke
          secure_container=deepseek-harness-secure-default
          cleanup() {
            for candidate in "$secure_container" "$container"; do
              docker logs "$candidate" 2>/dev/null || true
              docker rm --force "$candidate" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT

          wait_until_healthy() {
            local candidate=$1
            local healthy=false
            for _ in {1..18}; do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$candidate")
              if [[ "$status" == "healthy" ]]; then
                healthy=true
                break
              fi
              if [[ "$status" == "unhealthy" || "$(docker inspect --format '{{.State.Running}}' "$candidate")" != "true" ]]; then
                return 1
              fi
              sleep 5
            done
            [[ "$healthy" == "true" ]]
          }

          reported_version=$(docker run --rm "$TEST_IMAGE" --version)
          if [[ "$reported_version" != "${{ steps.settings.outputs.dsh_version }}" ]]; then
            echo "CLI reported ${reported_version}, expected ${{ steps.settings.outputs.dsh_version }}" >&2
            exit 1
          fi

          # Upstream 0.2.0 requires browser authentication: `dsh web` prints a
          # launch-token URL at startup, and exchanging the token mints an
          # authority-bound session cookie used for all later requests.
          rpc_body() { # $1=endpoint
            printf '{"type":"client-request","rpcId":"11111111-1111-4111-8111-111111111111","method":"%s","payload":{"args":{}}}' "$1"
          }

          mint_cookie() { # $1=port $2=host-authority $3=container $4=cookie-jar
            local launch_token=""
            for _ in {1..12}; do
            # The startup line looks like `dsh web: http://127.0.0.1:3081/?token=<token>`
            # and may carry a ` (LAN: ...)` suffix; take the first token occurrence.
            launch_token=$(docker logs "$3" 2>&1 | grep -o 'token=[^ )]*' | head -1 | cut -d= -f2)
              if [[ -n "$launch_token" ]]; then
                break
              fi
              sleep 5
            done
            if [[ -z "$launch_token" ]]; then
              echo "Could not find the dsh web launch token in container logs" >&2
              return 1
            fi
            curl --fail --silent --show-error --max-time 5 \
              --cookie-jar "$4" --output /dev/null \
              --header "Host: $2" \
              "http://127.0.0.1:$1/?token=${launch_token}"
          }

          rpc_status() { # $1=cookie-jar $2=port $3=host-authority $4=endpoint
            curl --silent --show-error --max-time 5 \
              --output /dev/null --write-out '%{http_code}' \
              --cookie "$1" --cookie-jar "$1" \
              --header "Host: $3" \
              --header "Origin: https://$3" \
              --header 'Sec-Fetch-Site: same-origin' \
              --header 'Content-Type: application/json' \
              --data "$(rpc_body "$4")" \
              "http://127.0.0.1:$2/api/$4"
          }

          docker run --detach \
            --name "$secure_container" \
            --publish 127.0.0.1::3080 \
            --env DSH_TRUSTED_HOSTS=dsh-smoke.example \
            "$TEST_IMAGE"
          wait_until_healthy "$secure_container"
          secure_port=$(docker port "$secure_container" 3080/tcp | awk -F: 'NR == 1 { print $NF }')
          secure_jar=$(mktemp)
          mint_cookie "$secure_port" dsh-smoke.example "$secure_container" "$secure_jar"

          secure_status=$(rpc_status "$secure_jar" "$secure_port" dsh-smoke.example settings/describe)
          if [[ "$secure_status" != "403" ]]; then
            echo "Remote configuration was not secure by default: HTTP $secure_status" >&2
            exit 1
          fi

          # Fail-closed: endpoints outside the provider configuration plane stay
          # loopback-only for trusted hosts, even when authenticated.
          unlisted_status=$(rpc_status "$secure_jar" "$secure_port" dsh-smoke.example agentPresets/list)
          if [[ "$unlisted_status" != "403" ]]; then
            echo "Non-configuration endpoint was exposed remotely: HTTP $unlisted_status" >&2
            exit 1
          fi

          # Loopback keeps full access, including endpoints closed to remotes.
          loopback_jar=$(mktemp)
          mint_cookie "$secure_port" 127.0.0.1 "$secure_container" "$loopback_jar"
          loopback_status=$(rpc_status "$loopback_jar" "$secure_port" 127.0.0.1 agentPresets/list)
          if [[ "$loopback_status" != "200" ]]; then
            echo "Loopback request was not served: HTTP $loopback_status" >&2
            exit 1
          fi
          docker rm --force "$secure_container" >/dev/null

          docker run --detach \
            --name "$container" \
            --publish 127.0.0.1::3080 \
            --env DSH_TRUSTED_HOSTS=dsh-smoke.example \
            --env DSH_ALLOW_REMOTE_CONFIGURATION=1 \
            "$TEST_IMAGE"
          if ! wait_until_healthy "$container"; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          host_port=$(docker port "$container" 3080/tcp | awk -F: 'NR == 1 { print $NF }')
          jar=$(mktemp)
          mint_cookie "$host_port" dsh-smoke.example "$container" "$jar"

          settings_response=$(curl --fail --silent --show-error --max-time 5 \
            --cookie "$jar" --cookie-jar "$jar" \
            --header 'Host: dsh-smoke.example' \
            --header 'Origin: https://dsh-smoke.example' \
            --header 'Sec-Fetch-Site: same-origin' \
            --header 'Content-Type: application/json' \
            --data "$(rpc_body settings/describe)" \
            "http://127.0.0.1:${host_port}/api/settings/describe")
          jq --exit-status \
            '.type == "server-response" and .result.ok == true and (.result.value.namespaces | type == "array")' \
            <<<"$settings_response" >/dev/null

          # Browser authentication is enforced even where the endpoint is open.
          unauth_status=$(curl --silent --show-error --max-time 5 \
            --output /dev/null --write-out '%{http_code}' \
            --header 'Host: dsh-smoke.example' \
            --header 'Content-Type: application/json' \
            --data "$(rpc_body settings/describe)" \
            "http://127.0.0.1:${host_port}/api/settings/describe")
          if [[ "$unauth_status" != "401" ]]; then
            echo "Unauthenticated request was not rejected: HTTP $unauth_status" >&2
            exit 1
          fi

          credentials_status=$(rpc_status "$jar" "$host_port" dsh-smoke.example credentials/describe)
          if [[ "$credentials_status" != "200" ]]; then
            echo "Remote credentials plane was not opened by the opt-in: HTTP $credentials_status" >&2
            exit 1
          fi

          untrusted_status=$(rpc_status "$jar" "$host_port" untrusted.example settings/describe)
          if [[ "$untrusted_status" != "403" ]]; then
            echo "Untrusted Host was not rejected: HTTP $untrusted_status" >&2
            exit 1
          fi

          native_status=$(rpc_status "$jar" "$host_port" dsh-smoke.example settings/openSettingsDocument)
          if [[ "$native_status" != "403" ]]; then
            echo "Native host operation was exposed remotely: HTTP $native_status" >&2
            exit 1
          fi

          picker_status=$(rpc_status "$jar" "$host_port" dsh-smoke.example directoryPicker/pick)
          if [[ "$picker_status" != "403" ]]; then
            echo "Native directory picker was exposed remotely: HTTP $picker_status" >&2
            exit 1
          fi

          # The opt-in opens the configuration plane only: terminals stay
          # loopback-only for trusted hosts.
          terminal_status=$(rpc_status "$jar" "$host_port" dsh-smoke.example terminal/create)
          if [[ "$terminal_status" != "403" ]]; then
            echo "Terminal endpoint was exposed remotely: HTTP $terminal_status" >&2
            exit 1
          fi

          for _ in {1..10}; do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != "true" ]]; then
              echo "Container exited after becoming healthy" >&2
              exit 1
            fi
            if [[ "$(docker inspect --format '{{.State.Health.Status}}' "$container")" != "healthy" ]]; then
              echo "Container lost healthy status" >&2
              exit 1
            fi
            # The index requires browser authentication; 401 proves the stack is up.
            index_status=$(curl --silent --show-error --max-time 5 \
              --output /dev/null --write-out '%{http_code}' \
              "http://127.0.0.1:${host_port}/")
            if [[ "$index_status" != "401" ]]; then
              echo "Unexpected index status: HTTP $index_status" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Log in to GHCR
        if: steps.publish.outputs.enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.publish.outputs.enabled == 'true' && steps.settings.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and optionally publish multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.enabled == 'true' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            DSH_VERSION=${{ steps.settings.outputs.dsh_version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.metadata.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha,scope=deepseek-harness
          cache-to: type=gha,mode=max,scope=deepseek-harness
          provenance: mode=max
          sbom: true
